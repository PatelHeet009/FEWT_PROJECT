<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WEEK 1</title>
    <style>
       body 
       {
         background-color:#1E222A;
         color: #E6EDF3;
        }
        input 
        {
           background-color:#282E39;
           border-radius: 8px;
        } 
        button 
        {
           background-color:#38BDF8; 
           color: #0D1117;
        } 

</style>
</head>
<body>

    <h3>enter the your task...!</h3>

    <input type="text" id="values" placeholder="enter the task..."><br><br>
    <button onclick="add()">Add task</button>
    <p id="output"></p>

    <script>
        function add() 
        {
            const input = document.getElementById("values").value

            if (input === '') 
            {
                alert("enter the task please");
            }

            document.getElementById("output").innerHTML +=
            "<h1>"+input+
            "<button onclick='complete(this)'>complete</button>"+
            "<button onclick='incomplete(this)'>incomplete</button></h1>";

            document.getElementById("values").value = "";

        }

        function complete(button)
        {
            let task = button.parentElement;
            task.style.textDecoration = "line-through";
            task.style.color = "green";
        }

        function incomplete(button)
        {
            let task = button.parentElement;
            task.style.textDecoration = "none"; 
            task.style.color = "red";
        }
    </script>
</body>
</html>
